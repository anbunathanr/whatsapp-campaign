version: '3.8'

services:
  # ── MongoDB Database ──────────────────────────────────────────────────────────
  mongodb:
    image: mongo:6
    container_name: whatsapp-campaign-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: whatsapp_campaign_platform
    networks:
      - whatsapp-campaign-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis Cache & Queue ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: whatsapp-campaign-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - whatsapp-campaign-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Node.js Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./node-backend
      dockerfile: Dockerfile
    container_name: whatsapp-campaign-backend
    restart: unless-stopped
    ports:
      - "8000:5000"
    env_file:
      - ./node-backend/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/whatsapp_campaign_platform
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - whatsapp-campaign-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── React Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Points the frontend bundle at the backend.
        # Change to your ALB URL for AWS deployments.
        VITE_API_URL: http://localhost:8000/api
    container_name: whatsapp-campaign-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - whatsapp-campaign-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  whatsapp-campaign-network:
    driver: bridge

