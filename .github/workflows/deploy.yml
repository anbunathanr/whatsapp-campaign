name: CI/CD Deployment to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─── 1. DEPLOY FRONTEND (S3 + CLOUDFRONT) ──────────────────────────────────
  deploy-frontend:
    name: Deploy React Frontend to S3 & CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          cd frontend
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3 Bucket
        run: |
          aws s3 sync ./frontend/dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  # ─── 2. DEPLOY BACKEND (EC2 + DOCKER COMPOSE) ──────────────────────────────
  deploy-backend:
    name: Deploy Node Backend to EC2
    runs-on: ubuntu-latest
    needs: deploy-frontend # Ensure frontend is deployed first

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd ~/whatsapp-campaign
            
            # Fetch latest changes from GitHub
            git reset --hard HEAD
            git pull origin main
            
            # Create node-backend/.env from GitHub Secrets passed to environment
            cat <<EOF > node-backend/.env
            NODE_ENV=production
            PORT=5000
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            REDIS_URL=redis://redis:6379
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=24h
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_REFRESH_EXPIRES_IN=7d
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_WHATSAPP_FROM=${{ secrets.TWILIO_WHATSAPP_FROM }}
            WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            UPLOAD_DIR=uploads
            MAX_FILE_SIZE_MB=5
            RATE_LIMIT_WINDOW_MS=900000
            RATE_LIMIT_MAX_REQUESTS=100
            LOG_LEVEL=info
            LOG_DIR=logs
            EOF
            
            # Restart backend and redis containers with the new build
            docker compose down backend redis
            docker compose up -d --build backend redis
            
            # Clean up old unused Docker images
            docker image prune -f
